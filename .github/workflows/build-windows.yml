name: Build Windows app

permissions:
  contents: write

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install ".[build]"
      - name: Build RallyPin.exe
        run: python -m PyInstaller --noconfirm --clean RallyPin.spec
      - uses: actions/upload-artifact@v4
        with:
          name: RallyPin-Windows
          path: dist/RallyPin.exe
          if-no-files-found: error
      - name: Attach executable to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/RallyPin.exe --clobber
